# OIDC session synchronization / keepalive configuration
#
# The keepalive mechanism addresses the case where the Keycloak SSO session
# expires (via idle timeout) before the Zimbra auth token expires. Without
# this, a user could remain authenticated in Zimbra even after their Keycloak
# session has been terminated (e.g., by idle timeout, admin revocation, or logout).
#
# How it works:
#   1. A JavaScript file (sso-keepalive.js) is loaded into the Zimbra Web Client.
#      It periodically (every sso.keepaliveInterval seconds) calls the
#      /sso/keepalive endpoint.
#   2. The KeepAliveHandler retrieves the OidcProfile from the HTTP session.
#      If the OIDC access token is expired (default 5 min from Keycloak),
#      it calls OidcClient.renewUserProfile() to perform a refresh_token grant,
#      keeping the Keycloak session alive.
#   3. If the refresh fails (Keycloak session truly expired), the handler
#      returns 401 and the JavaScript redirects the user to /oidc/login.
#   4. BaseSsoHandler.doLogin() also checks the OIDC profile expiration when
#      a ZM_AUTH_TOKEN is still valid but the OIDC session has expired,
#      forcing re-authentication through Keycloak.
#
# The Jetty session timeout (webdefault.xml) should be set to at least
# sso.keepaliveInterval + 60 seconds to prevent premature session loss.
# The KeepAliveHandler also programmatically extends the session on each call.
#
# Interval (in seconds) at which the keepalive JavaScript calls the /sso/keepalive endpoint.
# Recommended: 120 (2 minutes), which is less than the Keycloak access token
# lifespan (300s / 5min) to ensure proactive token refresh before expiration.
# sso.keepaliveInterval = 120
